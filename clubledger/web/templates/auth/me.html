<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account - ClubLedger</title>
</head>
<body>
  <h1>Account</h1>
  <div id="account-info">
    <p><strong>Name:</strong> {{ user.name }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
    <p id="membership-status"><strong>Membership:</strong> not a member</p>
  </div>

  <form method="post" action="/auth/logout">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit">Logout</button>
  </form>
</body>
</html>
