{# One decorative symbol for each real notification category. #}
{% macro notice_icon(key) -%}
<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
{% if key.startswith('payment:') %}
<rect x="3" y="5" width="18" height="14" rx="4"/><path d="M3 10h18M7 15h3"/>
{% elif key.startswith('membership:') %}
<rect x="3" y="4" width="18" height="16" rx="4"/><circle cx="9" cy="10" r="2"/><path d="M6 16c0-3 6-3 6 0M15 9h3M15 13h3"/>
{% else %}
<path d="m4 10 14-5v14L4 14zM18 10h2v4h-2M7 15l1 5h3l-1-4"/>
{% endif %}
</svg>
{%- endmacro %}
{% macro notice_category(key) -%}
{{ 'Payment update' if key.startswith('payment:') else 'Membership' if key.startswith('membership:') else 'Club announcement' }}
{%- endmacro %}
