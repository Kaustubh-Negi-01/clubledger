<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" fill="none">
  <!-- Campus life, drawn around a clear center: tickets, music, books and growth. -->
  <defs>
    <filter id="pencil-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="1.3" flood-color="#73694f" flood-opacity=".12"/>
    </filter>
  </defs>
  <g stroke="#b8ac8e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".65" filter="url(#pencil-shadow)">
    <!-- A looping path connects the corners like a campus walk. -->
    <path d="M-40 300C90 240 115 70 255 86S345 220 275 220 197 170 260 153 386 174 420 90" stroke-dasharray="3 9"/>
    <path d="M1120 65C1200 125 1260 75 1280 180S1330 340 1460 300" stroke-dasharray="3 9"/>
    <path d="M-40 755C75 690 130 850 230 860S377 770 340 742 266 773 310 800" stroke-dasharray="3 9"/>
    <path d="M1090 900C1190 800 1260 950 1340 845S1430 650 1490 700" stroke-dasharray="3 9"/>
    <!-- Admission ticket. -->
    <g transform="translate(92 350) rotate(-16)">
      <path d="M0 0H182V28C164 28 164 54 182 54V84H0V54C18 54 18 28 0 28Z" fill="#fff8e6"/>
      <path d="M132 6V78" stroke-dasharray="4 5"/>
      <path d="M27 27H103M27 40H82M27 56H96M149 23V60M155 23V60M162 23V60"/>
      <path d="M39-15L45-28M87-18L87-32M122-12L134-23"/>
    </g>
    <!-- A sketchbook with a small creative spark. -->
    <g transform="translate(1188 195) rotate(12)">
      <rect width="122" height="145" rx="12" fill="#eef2e4"/>
      <path d="M23 0V145M15 19H31M15 40H31M15 61H31M15 82H31M15 103H31M15 124H31"/>
      <path d="M48 110L90 48 103 57 61 119 48 122Z M87 53L99 62M50 111L61 118M44 35H83M45 135H95"/>
      <path d="M142 26L148 10 154 26 170 32 154 38 148 54 142 38 126 32Z"/>
    </g>
    <!-- Music notes and a soft sound wave. -->
    <g transform="translate(170 590) rotate(8)">
      <path d="M0 56V7L55 0V48M0 19L55 12"/>
      <ellipse cx="-10" cy="58" rx="10" ry="7"/><ellipse cx="45" cy="50" rx="10" ry="7"/>
      <path d="M88 16C103 27 103 43 88 54M101 6C127 26 127 47 101 66"/>
    </g>
    <!-- A seedling and concentric ripples, for a growing community. -->
    <g transform="translate(1220 680)">
      <ellipse cy="92" rx="105" ry="30"/><ellipse cy="92" rx="77" ry="19"/>
      <path d="M0 90V-8M0 35C-44 40-69 18-70-9-28-13-5 10 0 35Z M0 9C42 10 65-14 66-39 23-37 5-17 0 9Z" fill="#e1ebd8"/>
      <path d="M-54 5L0 35M48-25L0 9"/>
    </g>
    <path d="M310 510L317 491 324 510 343 517 324 524 317 543 310 524 291 517Z M1120 498L1125 484 1130 498 1144 503 1130 508 1125 522 1120 508 1106 503Z"/>
    <circle cx="70" cy="160" r="16"/><circle cx="1360" cy="480" r="11"/>
  </g>
  <!-- Small accents echo the ClubLedger brand without competing with the form. -->
  <g opacity=".5">
    <rect x="280" y="287" width="14" height="14" rx="3" fill="#fa785f" transform="rotate(15 287 294)"/>
    <rect x="1150" y="585" width="16" height="16" rx="3" fill="#f4ce56" transform="rotate(-12 1158 593)"/>
    <circle cx="340" cy="680" r="6" fill="#93af91"/>
    <circle cx="1124" cy="155" r="5" fill="#fa785f"/>
    <path d="M83 520L100 504M100 520L83 504M1340 105L1356 89M1356 105L1340 89" stroke="#c6aa52" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
