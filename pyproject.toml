[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clubledger"
version = "0.1.0"
description = "Financial ledger and operational system for Skyline Student Association"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "jinja2>=3.1.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["clubledger*"]
