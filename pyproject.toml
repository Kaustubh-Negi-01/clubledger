[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clubledger"
version = "0.1.0"
description = "Financial ledger and operational system for Skyline Student Association"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "jinja2>=3.1.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "qrcode[pil]>=7.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "beautifulsoup4>=4.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["clubledger*"]

[tool.setuptools.package-data]
clubledger = ["migrations/*.sql", "web/templates/*.html", "web/templates/*/*.html", "web/static/*", "web/static/fonts/*"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
